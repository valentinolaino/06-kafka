# POC Activación de Servicios con Kafka: infraestructura + servicios NestJS + Demo UI.
#
#   Levantar todo (la primera vez compila las imágenes, tarda varios minutos):
#       docker compose up -d --build
#   Demo UI: http://localhost:5173   Kafka UI: http://localhost:8080   Mailhog: http://localhost:8025
#
#   Escenario 4 (escalar billing):    docker compose up -d --scale billing-service=2
#   Escenario 5 (servicio loyalty):   docker compose --profile loyalty up -d loyalty-service
#
# OJO: los servicios de este archivo usan los puertos 3000 y 5173 y los mismos consumer groups que
# los "pnpm dev:*". No corras las dos formas a la vez: frená los pnpm antes de levantar Docker.
name: activation-poc

# Variables y dependencias comunes a todos los servicios de la POC.
x-app-env: &app-env
  # Dentro de Docker, Kafka se alcanza por el listener INTERNAL (kafka:19092), no por localhost:9092.
  KAFKA_BROKERS: kafka:19092

x-app-deps: &app-deps
  kafka:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully # los topics ya existen
  postgres:
    condition: service_healthy

services:
  # ---------- Kafka (modo KRaft, 1 broker, sin ZooKeeper) ----------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092" # acceso desde tu máquina (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Tres listeners: CONTROLLER (interno de KRaft), INTERNAL (entre contenedores), EXTERNAL (desde el host)
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Con un solo broker, los topics internos de Kafka no pueden replicarse más de 1 vez
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los topics se crean explícitamente con create-topics.sh, no automáticamente
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------- Crea los topics (3 particiones) y termina ----------
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  # ---------- Kafka UI: ver topics, mensajes, particiones y lag ----------
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: poc-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- PostgreSQL: una base de datos por servicio ----------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      # En tu PC el puerto es 15432: el 5432 y el 5433 suelen estar ocupados por un PostgreSQL instalado.
      # Dentro de Docker, los servicios siguen hablando con postgres:5432.
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan solo la primera vez que se crea el volumen
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Mailhog: bandeja de entrada falsa para los emails ----------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP (lo usa notification-service)
      - "8025:8025" # interfaz web

  # ---------- Servicios NestJS ----------
  # Los puertos de los servicios que solo consumen de Kafka no se publican: nadie los llama por HTTP.
  # Tampoco tienen container_name, para poder escalarlos con --scale (escenario 4).

  activation-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        APP: activation-api
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/activation_db
      # La UI corre en el navegador de tu máquina, en localhost:5173.
      CORS_ORIGIN: http://localhost:5173
    depends_on: *app-deps

  billing-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        APP: billing-service
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/billing_db
    depends_on: *app-deps

  provisioning-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        APP: provisioning-service
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/provisioning_db
    depends_on: *app-deps

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        APP: notification-service
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/notification_db
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      <<: *app-deps
      mailhog:
        condition: service_started

  crm-analytics-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        APP: crm-analytics-service
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm_analytics_db
    depends_on: *app-deps

  # Escenario 5: solo se levanta si se pide el profile "loyalty".
  loyalty-service:
    profiles: ["loyalty"]
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        APP: loyalty-service
    environment:
      <<: *app-env
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/loyalty_db
    depends_on: *app-deps

  # ---------- Demo UI ----------
  demo-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - activation-api

volumes:
  postgres-data:
